<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 425" width="730" height="425" font-family="Arial, Apple SD Gothic Neo, sans-serif" role="img" aria-labelledby="title">
<title id="title">사용자가 게임판을 편집하고 실행 취소 및 다시 실행하는 조건</title>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#222"/></marker><marker id="inherits" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 L13 7 L1 13 Z" fill="white" stroke="#222"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<rect x="215" y="22" width="486" height="375" fill="white" stroke="#222"/>
<text x="458" y="57" text-anchor="middle" font-size="18" font-weight="400" fill="#222">게임판 편집 기록</text>
<g fill="none" stroke="#222" stroke-width="1.65"><circle cx="75" cy="156" r="15"/><path d="M75 171V219 M47 185H103 M75 219L53 249 M75 219L97 249"/></g>
<text x="75" y="277" text-anchor="middle" font-size="18" font-weight="400" fill="#222">사용자</text>
