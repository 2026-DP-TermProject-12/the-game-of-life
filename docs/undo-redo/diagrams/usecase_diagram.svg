<text x="450" y="218" text-anchor="middle" font-size="17" font-weight="400" fill="#222">E 마지막 작업 실행 취소</text>
<text x="450" y="266" text-anchor="middle" font-size="14" font-weight="400" fill="#222">정지 중이며 취소할 기록이 있을 때</text>
<polyline points="103,185 279,315" fill="none" stroke="#222" stroke-width="1.25"/>
<ellipse cx="450" cy="315" rx="171" ry="31" fill="white" stroke="#222"/>
<text x="450" y="321" text-anchor="middle" font-size="17" font-weight="400" fill="#222">E 취소한 작업 다시 실행</text>
<text x="450" y="369" text-anchor="middle" font-size="14" font-weight="400" fill="#222">정지 중이며 다시 실행할 기록이 있을 때</text>
