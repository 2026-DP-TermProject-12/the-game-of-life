<ellipse cx="450" cy="109" rx="171" ry="31" fill="white" stroke="#222"/>
<text x="450" y="115" text-anchor="middle" font-size="17" font-weight="400" fill="#222">편집 또는 한 세대 진행</text>
<text x="450" y="163" text-anchor="middle" font-size="14" font-weight="400" fill="#222">클릭 · Clear · 프리셋 배치 · 경계 변경 · Tick</text>
<polyline points="103,185 279,212" fill="none" stroke="#222" stroke-width="1.25"/>
